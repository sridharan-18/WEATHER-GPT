# ============================================================================
# agri-portal-service  (port 8080)
# ============================================================================

# Server
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JPA + H2 (in-memory, query logs)
spring.datasource.url=jdbc:h2:mem:agriportal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Log every query the portal sends to the advisory service (dev convenience)
logging.level.com.agri.portal.service.PortalService=DEBUG
