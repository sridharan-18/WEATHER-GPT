# ============================================================================
# agri-advisory-service  (port 8081)
# ============================================================================

# Server
server.port=8081

# Data (in-memory H2), query logs stored here too
spring.datasource.url=jdbc:h2:mem:agriadvisory;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ------------------------------------------------------------------
# Gemini API (LLM for grounded answer generation)
#   Get a key from: https://aistudio.google.com/apikey
#   Pulled into the environment at runtime (never commit the real key).
# ------------------------------------------------------------------
spring.ai.gemini.api-key=${GEMINI_API_KEY:}
# Optional base URL (use the default Vertex AI/AI Studio endpoint)
ai.studio.api.base-url=https://generativelanguage.googleapis.com/v1beta

# ------------------------------------------------------------------
# IMD / Hyperlocal Weather
#   Free key from OpenWeatherMap (or ISRO/IMD forecast endpoint).
#   Fallback: if the key is missing, the service serves simulated per-district
#   data so the PoC still runs locally.
# ------------------------------------------------------------------
imd.base-url=${IMD_BASE_URL:https://api.openweathermap.org/data/2.5/forecast}
imd.api-key=${IMD_API_KEY:}
